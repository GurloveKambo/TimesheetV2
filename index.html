<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VB Built FieldSheet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>VB Built</h1>
</header>

<nav class="tabs">
  <button onclick="gotoTab('timesheet')" class="active">Timesheet</button>
  <button onclick="gotoTab('expenses')">Expenses</button>
  <button onclick="gotoTab('mileage')">Mileage</button>
  <button onclick="gotoTab('allowances')">Extras</button>
  <button onclick="gotoTab('review')">Review</button>
</nav>

<main>

<section id="timesheet" class="tab active">
  <input type="date" id="startDate" onchange="buildDays()">
  <div id="days"></div>
</section>

<section id="expenses" class="tab">
  <input id="expAmount" placeholder="Amount">
  <input id="expDesc" placeholder="Description">
  <button onclick="addExpense()">Add</button>
  <div id="expList"></div>
</section>

<section id="mileage" class="tab">
  <input id="km" placeholder="KM">
  <button onclick="addMileage()">Add</button>
  <div id="milList"></div>
</section>

<section id="allowances" class="tab">
  <input id="allowAmt" placeholder="Amount">
  <button onclick="addAllowance()">Add</button>
  <div id="allowList"></div>
</section>

<section id="review" class="tab">
  <button onclick="buildReview()">Refresh</button>
  <div id="reviewBox"></div>
  <button onclick="submitForm()">Submit</button>
</section>

</main>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
